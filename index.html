<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Joki MLBB Khusus pacar yapici❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Link font GTASA -->
  <link href="https://fonts.cdnfonts.com/css/gta-san-andreas" rel="stylesheet">

  <style>
    /* Reset & basic */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'GTA San Andreas', sans-serif; }
    body {
      background: #0d0d0d;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }

    /* Judul */
    .title-glow {
      font-size: 28px;
      text-align: center;
      color: #ff4d6d;
      text-shadow:
        0 0 5px #ff4d6d,
        0 0 10px #ff4d6d,
        0 0 20px #ff4d6d,
        0 0 40px #ff4d6d;
      margin-bottom: 30px;
    }

    /* Menu tombol */
    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .menu button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ff4d6d;
      color: #fff;
      box-shadow: 0 0 5px #ff4d6d, 0 0 10px #ff4d6d;
      transition: 0.3s;
    }
    .menu button:hover {
      box-shadow: 0 0 10px #ff4d6d, 0 0 20px #ff4d6d, 0 0 40px #ff4d6d;
    }

    /* Box menu */
    .box {
      background: #1a1a1a;
      border: 2px solid #ff4d6d;
      padding: 20px;
      margin-bottom: 20px;
      display: none;
      clip-path: polygon(
        30% 0%, 70% 0%, 100% 30%, 100% 70%,
        70% 100%, 30% 100%, 0% 70%, 0% 30%
      ); /* Segi delapan */
      box-shadow: 0 0 10px #ff4d6d;
    }

    .box h2 {
      margin-bottom: 15px;
      color: #ff4d6d;
      text-shadow: 0 0 5px #ff4d6d;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
      color: #fff;
    }

    select, input {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 5px;
      border: none;
      background: #2a2a2a; /* lebih gelap dari background box */
      color: #fff;
    }

    button.gendong, button {
      background: #ff4d6d;
      border-radius: 5px;
      padding: 10px;
      color: #fff;
      cursor: pointer;
      border: none;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0 0 5px #ff4d6d;
      transition: 0.3s;
    }
    button.gendong:hover, button:hover {
      box-shadow: 0 0 10px #ff4d6d, 0 0 20px #ff4d6d;
    }

    pre#pricelist, pre#hasil {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
      border: 1px solid #ff4d6d;
      box-shadow: 0 0 5px #ff4d6d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title-glow">Joki MLBB Khusus pacar yapici❤️</h1>
    <div class="menu">
      <button onclick="showMenu(1)">⭐ Joki Per Bintang</button>
      <button onclick="showMenu(2)">🔁 Joki Antar Rank</button>
      <button class="gendong" onclick="showMenu(3)">🔥 Gendong Per Bintang</button>
      <button class="gendong" onclick="showMenu(4)">🔥 Gendong Antar Rank</button>
      <button onclick="showMenu(5)">💰 Estimasi Nominal</button>
      <button onclick="showMenu(6)">📋 Price List</button>
      <button class="link-btn" onclick="openLink()">💌 Jangan Dibuka</button>
    </div>

    <!-- Contoh menu 1 -->
    <div class="box" id="menu1">
      <h2>Joki Per Bintang</h2>
      <label>Rank</label>
      <select id="rank1"></select>
      <label>Divisi</label>
      <select id="div1"></select>
      <label>Bintang Sekarang</label>
      <input type="number" id="star1" placeholder="Contoh: 2">
      <label>Tambah Bintang</label>
      <input type="number" id="addStar" placeholder="Contoh: 10">
      <button onclick="hitungPerBintang()">Hitung</button>
    </div>

    <pre id="hasil"></pre>
  </div>

  <script>
    function openLink() {
      window.location.href = "https://kaydenzolucy.github.io/18januari2026/";
    }

    function showMenu(num) {
      document.querySelectorAll('.box').forEach(box => box.style.display = 'none');
      const menu = document.getElementById('menu' + num);
      if(menu) menu.style.display = 'block';
    }
  </script>
</body>
</html>
