<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Joki MLBB Calculator Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>JOKI MLBB CALCULATOR PRO</h1>

  <div class="menu">
    <button onclick="showMenu(1)">⭐ Joki Per Bintang</button>
    <button onclick="showMenu(2)">🔁 Joki Antar Rank</button>
    <button class="gendong" onclick="showMenu(3)">🔥 Gendong Per Bintang</button>
    <button class="gendong" onclick="showMenu(4)">🔥 Gendong Antar Rank</button>
    <button onclick="showMenu(5)">💰 Estimasi Nominal</button>
    <button onclick="showMenu(6)">📋 Price List</button>
  </div>

  <!-- MENU 1 -->
  <div class="box" id="menu1">
    <h2>Joki Per Bintang</h2>
    <label>Rank</label><select id="rank1"></select>
    <label>Divisi</label><select id="div1"></select>
    <label>Bintang Sekarang</label><input type="number" id="star1">
    <label>Tambah Bintang</label><input type="number" id="addStar">
    <button onclick="hitungPerBintang()">Hitung</button>
  </div>

  <!-- MENU 2 -->
  <div class="box" id="menu2">
    <h2>Joki Antar Rank</h2>
    <h3>Rank Awal</h3>
    <label>Rank</label><select id="rankA"></select>
    <label>Divisi</label><select id="divA"></select>
    <label>Bintang</label><input type="number" id="starA">

    <h3>Rank Tujuan</h3>
    <label>Rank</label><select id="rankB"></select>
    <label>Divisi</label><select id="divB"></select>
    <label>Bintang</label><input type="number" id="starB">

    <button onclick="hitungAntarRank()">Hitung</button>
  </div>

  <!-- MENU 3 -->
  <div class="box" id="menu3">
    <h2>Gendong Per Bintang</h2>
    <label>Rank</label><select id="rankG1"></select>
    <label>Divisi</label><select id="divG1"></select>
    <label>Bintang Sekarang</label><input type="number" id="starG1">
    <label>Tambah Bintang</label><input type="number" id="addStarG">
    <button class="gendong" onclick="hitungGendongBintang()">Hitung</button>
  </div>

  <!-- MENU 4 -->
  <div class="box" id="menu4">
    <h2>Gendong Antar Rank</h2>
    <h3>Rank Awal</h3>
    <label>Rank</label><select id="rankGA"></select>
    <label>Divisi</label><select id="divGA"></select>
    <label>Bintang</label><input type="number" id="starGA">

    <h3>Rank Tujuan</h3>
    <label>Rank</label><select id="rankGB"></select>
    <label>Divisi</label><select id="divGB"></select>
    <label>Bintang</label><input type="number" id="starGB">

    <button class="gendong" onclick="hitungGendongRank()">Hitung</button>
  </div>

  <!-- MENU 5 -->
  <div class="box" id="menu5">
    <h2>Estimasi Berdasarkan Nominal</h2>

    <label>Mode</label>
    <select id="mode">
      <option value="PRICE">Joki Rank</option>
      <option value="GENDONG">Gendong</option>
    </select>

    <label>Rank Awal</label><select id="rankE"></select>
    <label>Divisi Awal</label><select id="divE"></select>
    <label>Bintang Sekarang</label><input type="number" id="starE">
    <label>Masukkan Nominal (Rp)</label><input type="number" id="nominal">

    <button onclick="estimasiNominal()">Estimasi</button>
  </div>

  <!-- MENU 6 -->
  <div class="box" id="menu6">
    <h2>Price List Joki & Gendong</h2>
    <pre id="pricelist"></pre>
  </div>

  <pre id="hasil"></pre>
</div>

<script src="script.js"></script>
</body>
</html>
