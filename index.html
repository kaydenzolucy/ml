<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Joki MLBB Khusus pacar yapici❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font Black Ops One -->
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Black Ops One', sans-serif;
      background: #0d0d0d;
      color: #fff;
    }
    .container {
      width: 95%;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }
    .title-glow {
      font-size: 28px;
      color: #ff3399;
      text-shadow: 0 0 5px #ff3399, 0 0 10px #ff3399, 0 0 20px #ff66cc;
      margin-bottom: 30px;
    }
    .menu button {
      background: #1a1a1a;
      color: #ff3399;
      border: 2px solid #ff3399;
      border-radius: 10px;
      padding: 12px 20px;
      margin: 8px;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 0 5px #ff3399;
      transition: all 0.3s ease;
    }
    .menu button:hover {
      color: #fff;
      box-shadow: 0 0 15px #ff66cc, 0 0 30px #ff3399;
      border-color: #ff66cc;
    }
    button.gendong {
      background: #1a0d1a;
      border-color: #ff66cc;
      color: #ff66cc;
      box-shadow: 0 0 5px #ff66cc;
    }
    button.gendong:hover {
      box-shadow: 0 0 15px #ff99ff, 0 0 30px #ff66cc;
      color: #fff;
      border-color: #ff99ff;
    }
    .link-btn {
      border-color: #66ffcc;
      color: #66ffcc;
      box-shadow: 0 0 5px #66ffcc;
    }
    .link-btn:hover {
      box-shadow: 0 0 15px #99fff0, 0 0 30px #66ffcc;
      color: #fff;
      border-color: #99fff0;
    }
    .box {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #1a1a1a;
      border-radius: 12px;
      border: 2px solid #ff3399;
      box-shadow: 0 0 10px #ff3399;
      text-align: left;
    }
    .box label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
      color: #ff99ff;
    }
    .box select, .box input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #ff3399;
      background: #2a2a2a;
      color: #fff;
      margin-bottom: 10px;
    }
    .box button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: 2px solid #ff3399;
      background: #1a1a1a;
      color: #ff3399;
      cursor: pointer;
      box-shadow: 0 0 5px #ff3399;
      transition: all 0.3s ease;
    }
    .box button:hover {
      color: #fff;
      box-shadow: 0 0 15px #ff66cc, 0 0 30px #ff3399;
      border-color: #ff66cc;
    }
    #pricelist, #hasil {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #ff3399;
      box-shadow: 0 0 10px #ff3399;
      margin-top: 20px;
      color: #fff;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title-glow">Joki MLBB Khusus pacar yapici❤️</h1>

    <div class="menu">
      <button onclick="showMenu(1)">⭐ Joki Per Bintang</button>
      <button onclick="showMenu(2)">🔁 Joki Antar Rank</button>
      <button class="gendong" onclick="showMenu(3)">🔥 Gendong Per Bintang</button>
      <button class="gendong" onclick="showMenu(4)">🔥 Gendong Antar Rank</button>
      <button onclick="showMenu(5)">💰 Estimasi Nominal</button>
      <button onclick="showMenu(6)">📋 Price List</button>
      <button class="link-btn" onclick="openLink()">💌 Jangan Dibuka</button>
    </div>

    <!-- MENU 1 -->
    <div class="box" id="menu1">
      <h2>Joki Per Bintang</h2>
      <label>Rank</label>
      <select id="rank1"></select>
      <label>Divisi</label>
      <select id="div1"></select>
      <label>Bintang Sekarang</label>
      <input type="number" id="star1" placeholder="Contoh: 2">
      <label>Tambah Bintang</label>
      <input type="number" id="addStar" placeholder="Contoh: 10">
      <button onclick="hitungPerBintang()">Hitung</button>
    </div>

    <!-- MENU 2 -->
    <div class="box" id="menu2">
      <h2>Joki Antar Rank</h2>
      <h3>Rank Awal</h3>
      <label>Rank</label>
      <select id="rankA"></select>
      <label>Divisi</label>
      <select id="divA"></select>
      <label>Bintang</label>
      <input type="number" id="starA" placeholder="Contoh: 1">
      <h3>Rank Tujuan</h3>
      <label>Rank</label>
      <select id="rankB"></select>
      <label>Divisi</label>
      <select id="divB"></select>
      <label>Bintang</label>
      <input type="number" id="starB" placeholder="Contoh: 0">
      <button onclick="hitungAntarRank()">Hitung</button>
    </div>

    <!-- MENU 3 -->
    <div class="box" id="menu3">
      <h2>Gendong Per Bintang</h2>
      <label>Rank</label>
      <select id="rankG1"></select>
      <label>Divisi</label>
      <select id="divG1"></select>
      <label>Bintang Sekarang</label>
      <input type="number" id="starG1" placeholder="Contoh: 3">
      <label>Tambah Bintang</label>
      <input type="number" id="addStarG" placeholder="Contoh: 5">
      <button class="gendong" onclick="hitungGendongBintang()">Hitung</button>
    </div>

    <!-- MENU 4 -->
    <div class="box" id="menu4">
      <h2>Gendong Antar Rank</h2>
      <h3>Rank Awal</h3>
      <label>Rank</label>
      <select id="rankGA"></select>
      <label>Divisi</label>
      <select id="divGA"></select>
      <label>Bintang</label>
      <input type="number" id="starGA" placeholder="Contoh: 4">
      <h3>Rank Tujuan</h3>
      <label>Rank</label>
      <select id="rankGB"></select>
      <label>Divisi</label>
      <select id="divGB"></select>
      <label>Bintang</label>
      <input type="number" id="starGB" placeholder="Contoh: 0">
      <button class="gendong" onclick="hitungGendongRank()">Hitung</button>
    </div>

    <!-- MENU 5 -->
    <div class="box" id="menu5">
      <h2>Estimasi Berdasarkan Nominal</h2>
      <label>Mode</label>
      <select id="mode">
        <option value="PRICE">Joki Rank</option>
        <option value="GENDONG">Gendong</option>
      </select>
      <label>Rank</label>
      <select id="rankE"></select>
      <label>Divisi</label>
      <select id="divE"></select>
      <label>Bintang Sekarang</label>
      <input type="number" id="starE" placeholder="Contoh: 2">
      <label>Nominal (Rp)</label>
      <input type="number" id="nominal" placeholder="Contoh: 100000">
      <button onclick="estimasiNominal()">Estimasi</button>
    </div>

    <!-- MENU 6 -->
    <div class="box" id="menu6">
      <h2>Price List Joki & Gendong</h2>
      <pre id="pricelist"></pre>
    </div>

    <pre id="hasil"></pre>
  </div>

  <script src="script.js"></script>
  <script>
    function openLink() {
      window.location.href = "https://kaydenzolucy.github.io/18januari2026/";
    }

    function showMenu(num) {
      const menus = document.querySelectorAll('.box');
      menus.forEach(m => m.style.display = 'none');
      const selected = document.getElementById('menu' + num);
      if (selected) selected.style.display = 'block';
    }
  </script>
</body>
</html>
