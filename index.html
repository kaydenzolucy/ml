<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>🐱MINRA🐱</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONT RETRO -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <!-- MAIN CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <!-- HEADER + MINI CURRENCY -->
  <h1 class="title-glow">
  <span class="main-title">JOKI MLBB</span>
  <span class="sub-title">🐱MINRA🐱</span>
</h1>

    <div class="currency-mini">
      <select id="currency" onchange="changeCurrency()">
        <option value="IDR">🇮🇩 IDR</option>
        <option value="MYR">🇲🇾 MYR</option>
      </select>
      <div id="rateInfo">Memuat kurs…</div>
    </div>
  </div>

<!-- MINRA GALLERY BACKGROUND RAIN -->
<div class="minra-rain">
  <img src="img1.png" class="rain-img">
  <img src="img2.png" class="rain-img">
  <img src="img3.png" class="rain-img">
  <img src="img4.png" class="rain-img">
  <img src="img5.png" class="rain-img">
  <img src="img6.png" class="rain-img">
  <img src="img7.png" class="rain-img">
  <img src="img8.png" class="rain-img">
  <img src="img9.png" class="rain-img">
  <img src="img10.png" class="rain-img">
</div>

  <!-- MENU -->
  <div class="menu">
    <button onclick="showMenu(1)">⭐ Joki Per Bintang</button>
    <button onclick="showMenu(2)">🔁 Joki Antar Rank</button>
    <button class="gendong" onclick="showMenu(3)">🔥 Gendong Per Bintang</button>
    <button class="gendong" onclick="showMenu(4)">🔥 Gendong Antar Rank</button>
    <button onclick="showMenu(5)">💰 Estimasi Nominal</button>
    <button onclick="showMenu(6)">📋 Price List</button>
    <button class="link-btn" onclick="openLink()">💌 Jangan Dibuka</button>
  </div>

  <!-- MENU 1 -->
  <div class="box" id="menu1">
    <h2>Joki Per Bintang</h2>
    <select id="rank1"></select>
    <select id="div1"></select>
    <input type="number" id="star1" placeholder="Bintang sekarang">
    <input type="number" id="addStar" placeholder="Tambah bintang">
    <button onclick="hitungPerBintang()">Hitung</button>
  </div>

  <!-- MENU 2 -->
  <div class="box" id="menu2">
    <h2>Joki Antar Rank</h2>
    <h3>Rank Awal</h3>
    <select id="rankA"></select>
    <select id="divA"></select>
    <input type="number" id="starA" placeholder="Bintang">

    <h3>Rank Tujuan</h3>
    <select id="rankB"></select>
    <select id="divB"></select>
    <input type="number" id="starB" placeholder="Bintang">

    <button onclick="hitungAntarRank()">Hitung</button>
  </div>

  <!-- MENU 3 -->
  <div class="box" id="menu3">
    <h2>Gendong Per Bintang</h2>
    <select id="rankG1"></select>
    <select id="divG1"></select>
    <input type="number" id="starG1" placeholder="Bintang sekarang">
    <input type="number" id="addStarG" placeholder="Tambah bintang">
    <button class="gendong" onclick="hitungGendongBintang()">Hitung</button>
  </div>

  <!-- MENU 4 -->
  <div class="box" id="menu4">
    <h2>Gendong Antar Rank</h2>
    <h3>Rank Awal</h3>
    <select id="rankGA"></select>
    <select id="divGA"></select>
    <input type="number" id="starGA" placeholder="Bintang">

    <h3>Rank Tujuan</h3>
    <select id="rankGB"></select>
    <select id="divGB"></select>
    <input type="number" id="starGB" placeholder="Bintang">

    <button class="gendong" onclick="hitungGendongRank()">Hitung</button>
  </div>

  <!-- MENU 5 -->
  <div class="box" id="menu5">
    <h2>Estimasi Nominal</h2>
    <select id="mode">
      <option value="PRICE">Joki Rank</option>
      <option value="GENDONG">Gendong</option>
    </select>
    <select id="rankE"></select>
    <select id="divE"></select>
    <input type="number" id="starE" placeholder="Bintang sekarang">
    <input type="number" id="nominal" placeholder="Nominal">
    <button onclick="estimasiNominal()">Estimasi</button>
  </div>

  <!-- MENU 6 -->
  <div class="box" id="menu6">
    <h2>Price List</h2>
    <pre id="pricelist"></pre>
  </div>

  <pre id="hasil"></pre>

</div>

<script src="script.js"></script>
<script>
function openLink(){
  window.location.href = "https://kaydenzolucy.github.io/18januari2026/";
}
</script>

</body>
</html>
