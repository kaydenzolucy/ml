<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Joki MLBB Khusus pacar yapici❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- GTASA Font -->
  <link href="https://fonts.cdnfonts.com/css/gta-san-andreas" rel="stylesheet">

  <style>
    /* Reset & Basic */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'GTA San Andreas', sans-serif;
    }
    body {
      background-color: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 900px;
    }

    /* Judul */
    .title-glow {
      font-size: 28px;
      text-align: center;
      color: #ff3399;
      text-shadow: 0 0 5px #ff3399, 0 0 10px #ff3399, 0 0 20px #ff66cc;
      margin-bottom: 30px;
    }

    /* Menu tombol segi delapan */
    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      margin-bottom: 30px;
    }
    .menu button {
      background-color: #222;
      color: #ff3399;
      border: 2px solid #ff3399;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
      font-family: 'GTA San Andreas', sans-serif;
      clip-path: polygon(
        30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%
      ); /* segi delapan */
      text-shadow: 0 0 3px #ff66cc, 0 0 5px #ff66cc;
      transition: 0.3s;
    }
    .menu button:hover {
      background-color: #ff3399;
      color: #111;
      text-shadow: 0 0 10px #fff;
      box-shadow: 0 0 10px #ff3399, 0 0 20px #ff66cc;
    }

    /* Box menu */
    .box {
      display: none;
      background-color: #1a1a1a;
      border: 2px solid #ff3399;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ff3399, 0 0 20px #ff66cc;
    }
    .box h2 {
      color: #ff3399;
      margin-bottom: 15px;
    }
    .box label {
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    .box select, .box input {
      width: 100%;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #555;
      background-color: #222; /* warna lebih gelap */
      color: #fff;
    }
    .box button {
      margin-top: 15px;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background-color: #ff3399;
      color: #111;
      font-family: 'GTA San Andreas', sans-serif;
      cursor: pointer;
      box-shadow: 0 0 5px #ff3399, 0 0 10px #ff66cc;
      transition: 0.3s;
    }
    .box button:hover {
      background-color: #ff66cc;
      color: #111;
      box-shadow: 0 0 10px #ff3399, 0 0 20px #ff66cc;
    }

    /* Pre hasil */
    pre#hasil, pre#pricelist {
      background-color: #222;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ff3399;
      white-space: pre-wrap;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title-glow">Joki MLBB Khusus pacar yapici❤️</h1>

    <div class="menu">
      <button onclick="showMenu(1)">⭐ Joki Per Bintang</button>
      <button onclick="showMenu(2)">🔁 Joki Antar Rank</button>
      <button onclick="showMenu(3)">🔥 Gendong Per Bintang</button>
      <button onclick="showMenu(4)">🔥 Gendong Antar Rank</button>
      <button onclick="showMenu(5)">💰 Estimasi Nominal</button>
      <button onclick="showMenu(6)">📋 Price List</button>
      <button class="link-btn" onclick="openLink()">💌 Jangan Dibuka</button>
    </div>

    <!-- Contoh salah satu box -->
    <div class="box" id="menu1">
      <h2>Joki Per Bintang</h2>
      <label>Rank</label>
      <select id="rank1"></select>
      <label>Divisi</label>
      <select id="div1"></select>
      <label>Bintang Sekarang</label>
      <input type="number" id="star1" placeholder="Contoh: 2">
      <label>Tambah Bintang</label>
      <input type="number" id="addStar" placeholder="Contoh: 10">
      <button onclick="hitungPerBintang()">Hitung</button>
    </div>

    <pre id="hasil"></pre>
  </div>

  <script>
    function openLink(){
      window.location.href="https://kaydenzolucy.github.io/18januari2026/";
    }

    function showMenu(id){
      document.querySelectorAll('.box').forEach(b => b.style.display = 'none');
      const box = document.getElementById('menu' + id);
      if(box) box.style.display = 'block';
    }
  </script>
</body>
</html>
