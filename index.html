<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Joki MLBB Khusus pacar yapici❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font Black Ops One -->
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">

  <style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,#1a0f2e,#12081f);
    color:#fff;
    font-family:"Segoe UI",Arial,sans-serif;
  }
  .container{max-width:100%;padding:18px;text-align:center;}

  /* ============================= */
  /* JUDUL GLITCH NEON KEREN */
  .title-glitch {
    font-family: 'Black Ops One', cursive;
    font-size: 48px;
    position: relative;
    color: #ff4fa7;
    text-transform: uppercase;
    letter-spacing: 2px;
    animation: glow 1.5s infinite alternate;
  }
  .title-glitch::before,
  .title-glitch::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    color: #ff4fa7;
    overflow: hidden;
  }
  .title-glitch::before {
    left: 2px;
    text-shadow: -2px 0 #00fff9, 2px 0 #ff00ff;
    animation: glitchAnimTop 2s infinite linear alternate-reverse;
  }
  .title-glitch::after {
    left: -2px;
    text-shadow: -2px 0 #ff0000, 2px 0 #00ff00;
    animation: glitchAnimBottom 2s infinite linear alternate-reverse;
  }

  @keyframes glow {
    0% {text-shadow:0 0 5px #ff4fa7,0 0 10px #ff4fa7,0 0 20px #ff69b4,0 0 40px #ff69b4,0 0 80px #ff69b4;}
    50% {text-shadow:0 0 10px #ff4fa7,0 0 20px #ff7ac8,0 0 40px #ff69b4,0 0 60px #ff7ac8,0 0 100px #ff69b4;}
    100% {text-shadow:0 0 5px #ff4fa7,0 0 10px #ff4fa7,0 0 20px #ff69b4,0 0 40px #ff69b4,0 0 80px #ff69b4;}
  }

  @keyframes glitchAnimTop {
    0% {transform: translate(0,0);}
    10% {transform: translate(-2px,-2px);}
    20% {transform: translate(2px,2px);}
    30% {transform: translate(-2px,2px);}
    40% {transform: translate(2px,-2px);}
    50% {transform: translate(-1px,1px);}
    60% {transform: translate(1px,-1px);}
    70% {transform: translate(-1px,-2px);}
    80% {transform: translate(2px,1px);}
    90% {transform: translate(-2px,0);}
    100% {transform: translate(0,0);}
  }

  @keyframes glitchAnimBottom {
    0% {transform: translate(0,0);}
    10% {transform: translate(2px,2px);}
    20% {transform: translate(-2px,-2px);}
    30% {transform: translate(2px,-2px);}
    40% {transform: translate(-2px,2px);}
    50% {transform: translate(1px,-1px);}
    60% {transform: translate(-1px,1px);}
    70% {transform: translate(2px,0);}
    80% {transform: translate(-1px,-2px);}
    90% {transform: translate(1px,2px);}
    100% {transform: translate(0,0);}
  }

  /* ============================= */
  /* MENU & BOX (tetap sama) */
  .menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin:20px 0;
  }
  .menu button{
    padding:18px 12px;
    font-size:16px;
    font-weight:600;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,#ff7ac8,#ff4fa7);
    color:#fff;
    cursor:pointer;
    box-shadow:0 6px 16px rgba(255,79,167,.35);
    transition:all 0.3s ease;
  }
  .menu button:hover{box-shadow:0 0 18px #ff7ac8;}
  .menu button.gendong{background:linear-gradient(135deg,#ffb347,#ff9800);}
  .menu button.link-btn{background:linear-gradient(135deg,#8fd3f4,#84fab0);color:#0b2b1f;}

  .box{display:none;background:rgba(255,255,255,.08);padding:18px;border-radius:20px;margin-bottom:18px;box-shadow:0 8px 22px rgba(0,0,0,.35);}
  .box.show{display:block !important;}
  h2{font-size:20px;margin-bottom:12px;color:#ffd6ec;}
  h3{font-size:16px;margin:10px 0 6px;color:#ffc1df;}
  label{font-size:14px;opacity:.9;}
  select,input{width:100%;padding:15px;margin:6px 0 14px;font-size:16px;border-radius:16px;border:none;background:#2b1b3a;color:#fff;}
  input::placeholder{color:#cfa3bf;}
  .box button{width:100%;padding:16px;font-size:17px;font-weight:600;border:none;border-radius:18px;background:linear-gradient(135deg,#ff7ac8,#ff4fa7);color:#fff;cursor:pointer;box-shadow:0 6px 18px rgba(255,79,167,.4);}
  .box button.gendong{background:linear-gradient(135deg,#ffb347,#ff9800);}
  pre{background:#12071f;padding:16px;border-radius:18px;white-space:pre-wrap;font-size:14px;line-height:1.6;margin-top:16px;box-shadow:inset 0 0 10px rgba(255,255,255,.05);}
  </style>
</head>
<body>
<div class="container">
  <h1 class="title-glitch" data-text="Joki MLBB Khusus pacar yapici❤️">
    Joki MLBB Khusus pacar yapici❤️
  </h1>
  <!-- menu tetap sama -->
  <div class="menu">
    <button onclick="showMenu(1)">⭐ Joki Per Bintang</button>
    <button onclick="showMenu(2)">🔁 Joki Antar Rank</button>
    <button class="gendong" onclick="showMenu(3)">🔥 Gendong Per Bintang</button>
    <button class="gendong" onclick="showMenu(4)">🔥 Gendong Antar Rank</button>
    <button onclick="showMenu(5)">💰 Estimasi Nominal</button>
    <button onclick="showMenu(6)">📋 Price List</button>
    <button class="link-btn" onclick="openLink()">💌 Jangan Dibuka</button>
  </div>

  <!-- boxes tetap sama -->
  <div class="box" id="menu1"><h2>Joki Per Bintang</h2></div>
  <div class="box" id="menu2"><h2>Joki Antar Rank</h2></div>
  <div class="box" id="menu3"><h2>Gendong Per Bintang</h2></div>
  <div class="box" id="menu4"><h2>Gendong Antar Rank</h2></div>
  <div class="box" id="menu5"><h2>Estimasi Berdasarkan Nominal</h2></div>
  <div class="box" id="menu6"><h2>Price List Joki & Gendong</h2></div>
</div>

<script>
function openLink(){ window.location.href="https://kaydenzolucy.github.io/18januari2026/";}
function showMenu(id){document.querySelectorAll('.box').forEach(b=>b.classList.remove('show'));document.getElementById('menu'+id).classList.add('show');}
</script>
</body>
</html>
